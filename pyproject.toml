[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ram-tool"
version = "1.0.0"
description = "Fetch RAM value from API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "nodepisss", email = "bxhxbb352@gmail.com"}
]
dependencies = [
    "requests>=2.31.0"
]

[project.scripts]
ram-tool = "ram_tool.cli:main"
